services:
  resume-screener:
    build:
      context: .
      dockerfile: Dockerfile
    image: khushiyadav35/resume-screener-skill-gap:latest
    container_name: skillbridge-ai
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
